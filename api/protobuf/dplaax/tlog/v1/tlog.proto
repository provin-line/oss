// dplaax.tlog.v1 is the read surface for per-loop emission transparency
// logs: after every successful publish, a producing loop appends
// {credentialHash, sequenceNo} to its hash-chained log. This service serves
// signed checkpoints and record ranges so a relying party can reconcile
// what it RECEIVED against what the loop EMITTED — at-most-once transport
// loss becomes detectable and the lost events nameable.
//
// Reconciliation scope (declared, not assumed): this proves DIRECT envelope
// delivery per producing loop. Across an aggregate boundary, "did every
// source reading make it into the aggregate?" is a different question,
// answered by joining this log with dplaax.audit.v1.GetConsumedSources.
//
// Trust model (hash-chain PoC posture): the chain hash makes retroactive
// mutation detectable GIVEN an honest earlier checkpoint; the signature
// makes the operator non-repudiably committed to a head. Merkle inclusion
// proofs are the production extension; a future proof RPC is additive.
syntax = "proto3";

package dplaax.tlog.v1;

option go_package = "github.com/provin-line/oss/gen/go/dplaax/tlog/v1;tlogpb";

import "dplaax/chain/v1/chain.proto";
import "o3co/authz/v1/policy.proto";

// TlogService serves emission-log checkpoints and records. Every RPC
// declares its authorization policy via the o3co.authz.v1 method option
// (enforced by the network interceptor, asserted by a descriptor test).
// The resource "tlog" is deliberately distinct from "audit" and "vc":
// emission metadata is its own grant surface — a deployment may grant
// reconciliation access without credential-read access.
service TlogService {
  // GetLogCheckpoint returns the signed head commitment of one emission
  // log. The signature covers the JCS canonicalization of the versioned,
  // domain-separated view {v:1, purpose:"dplaax-tlog-checkpoint", logId,
  // head, signedBy, size, timestamp} (size and timestamp string-encoded):
  // log_id is INSIDE the signature, so a checkpoint from one log can never
  // be presented as another's. A consumer additionally checks signed_by's
  // pipeline DID == log_id — an invariant the node enforces at boot.
  // NotFound when this node runs no producing loop with that log id.
  rpc GetLogCheckpoint(GetLogCheckpointRequest) returns (GetLogCheckpointResponse) {
    option (o3co.authz.v1.policy) = {resource: "tlog", action: "read"};
  }
  // ListLogRecords returns records [start_index, start_index + count) of
  // one emission log, index-ascending. count follows the pagination
  // convention's size rules (0 = 64, negative = InvalidArgument, clamped at
  // 256). Fewer records than count means the log currently ends there — an
  // append-only log's index IS the public, stable cursor, so this RPC
  // deliberately uses it instead of an opaque token (the token convention
  // hides UNSTABLE scan positions; hiding a stable public index would only
  // obscure reconciliation, whose whole point is "which sequence numbers
  // exist").
  rpc ListLogRecords(ListLogRecordsRequest) returns (ListLogRecordsResponse) {
    option (o3co.authz.v1.policy) = {resource: "tlog", action: "read"};
  }
  // MirrorLogSegment ships one checkpoint-aligned segment of a producing
  // loop's local emission log to the registry for durable custody (D-T1
  // async mirror: sync-append stays rejected, so this call runs off the
  // per-emission hot path, on a background shipper's own schedule).
  //
  // Trust model: L1 + in-band wireauth — the PDP gate (this policy option)
  // decides whether the caller may mirror at all; the request additionally
  // carries a wireauth AuthProof the handler verifies in-band, whose signed
  // view covers log_id, from_index (decimal), checkpoint.head, and
  // segment_digest = sha256 over the ordered record payload hashes (binds
  // the payload list into the proof; the signed checkpoint head
  // additionally commits the payloads transitively — see the alignment
  // rule below).
  //
  // Checkpoint alignment (mandatory): checkpoint.size MUST equal
  // from_index + len(record_payloads) — no ahead-checkpoints, ever. The
  // registry recomputes the hash chain from its stored tail through the
  // segment and REQUIRES the recomputed head to equal checkpoint.head, so
  // payload substitution breaks the equality even independent of the
  // segment_digest check above (defense in depth, not redundancy).
  //
  // Exact-extend only: from_index MUST equal the log's current
  // GetMirrorState.acked_size. A byte-identical replay of an already-acked
  // segment is a no-op success (the idempotent resume case); from_index >
  // acked_size (a gap) and any partial overlap are FailedPrecondition;
  // from_index + len(record_payloads) overflow is InvalidArgument.
  //
  // Checkpoint monotonicity: the stored/served checkpoint for a log never
  // regresses — a valid but older checkpoint presented here is ignored and
  // never replaces the current head.
  rpc MirrorLogSegment(MirrorLogSegmentRequest) returns (MirrorLogSegmentResponse) {
    option (o3co.authz.v1.policy) = {resource: "tlog", action: "mirror"};
  }
  // GetMirrorState returns the registry's durable mirror size for one
  // emission log — the shipper's resume cursor. Deliberately DISTINCT from
  // GetLogCheckpoint.size: GetLogCheckpoint reports the local loop's
  // SIGNED-SOURCE view (what it has produced and signed), while acked_size
  // here reports what the registry has durably ACCEPTED and verified via
  // MirrorLogSegment. A shipper resuming after restart reads
  // GetMirrorState.acked_size and sets the next call's from_index to it —
  // GetLogCheckpoint.size is NEVER a valid substitute (it can be ahead of
  // what the registry has actually stored).
  rpc GetMirrorState(GetMirrorStateRequest) returns (GetMirrorStateResponse) {
    option (o3co.authz.v1.policy) = {resource: "tlog", action: "read"};
  }
}

message GetLogCheckpointRequest {
  // log_id is the producing loop's output subject (its pipeline DID) — the
  // same name the consumer already holds as its granted ingress subject.
  string log_id = 1;
}
message GetLogCheckpointResponse {
  // log_id echoes the request so a stored or forwarded checkpoint is
  // self-contained (it is also INSIDE the signature).
  string log_id = 1;
  // size / timestamp are string-encoded (uint64 survives IEEE-754 JSON
  // consumers past 2^53; the codebase avoids google.protobuf.Timestamp).
  string size = 2;
  // head is the chain-head hash after `size` records; empty for an empty log.
  string head = 3;
  string timestamp = 4; // RFC 3339 UTC
  // signed_by is the verification-method DID URL of the producing loop's
  // issuer key — the same identity that signs the loop's credentials.
  string signed_by = 5;
  bytes signature = 6;
}

message ListLogRecordsRequest {
  string log_id = 1;
  // start_index is a decimal uint64; empty means 0. Malformed values are
  // InvalidArgument.
  string start_index = 2;
  int32 count = 3;
}
message LogRecord {
  string index = 1; // decimal uint64
  // payload is the emission record bytes: {"credentialHash","sequenceNo"}.
  bytes payload = 2;
  // hash is the chain commitment, EXACTLY as the implementations compute
  // it: sha256( []byte(prevHashHex) ‖ payload ), the genesis record using
  // the EMPTY STRING as prevHashHex (not 32 zero bytes) — pinned by a
  // shared test vector in the log contract suite so external replay
  // verification has exact bytes.
  string hash = 3;
}
message ListLogRecordsResponse {
  repeated LogRecord records = 1;
}

message MirrorLogSegmentRequest {
  // log_id is the emission log's identity — the same log_id as
  // GetLogCheckpointRequest.log_id (see D-T3 for the registry-side signer
  // binding this call additionally enforces at the handler).
  string log_id = 1;
  // from_index is the segment's starting index. MUST equal the log's
  // current GetMirrorState.acked_size — see MirrorLogSegment's own doc for
  // the exact-extend, gap, overlap, and replay rules this enforces.
  uint64 from_index = 2;
  // record_payloads are the ordered record payload bytes for
  // [from_index, from_index + len(record_payloads)) — the same payload
  // bytes the local log already hash-chained. The registry recomputes the
  // chain hash from its stored tail through these payloads and requires
  // the result to equal checkpoint.head.
  repeated bytes record_payloads = 3;
  // checkpoint is the loop-signed head covering EXACTLY this segment's end
  // (checkpoint.size == from_index + len(record_payloads); see
  // MirrorLogSegment's own doc for the alignment and monotonicity rules).
  // Wire-shaped identically to GetLogCheckpointResponse so a shipper can
  // forward what GetLogCheckpoint already returned.
  GetLogCheckpointResponse checkpoint = 4;
  // auth_proof is the L2 wireauth token, verified in-handler — mirrors the
  // proof-carrying shape of dplaax.audit.v1.RegisterEvidenceRequest, reusing
  // dplaax.chain.v1.AuthProof rather than redefining it (a redefinition
  // would be a drift source). Its signed view is described on
  // MirrorLogSegment's own doc (trust model paragraph).
  dplaax.chain.v1.AuthProof auth_proof = 5;
}
message MirrorLogSegmentResponse {
  // acked_size is the registry's durable mirror size after this call —
  // equal to from_index + len(record_payloads) on success, or unchanged on
  // a byte-identical replay no-op (see MirrorLogSegment's own doc). Callers
  // may treat this the same as a subsequent GetMirrorState.acked_size read.
  uint64 acked_size = 1;
}

message GetMirrorStateRequest {
  // log_id is the emission log's identity, same as
  // MirrorLogSegmentRequest.log_id / GetLogCheckpointRequest.log_id.
  string log_id = 1;
}
message GetMirrorStateResponse {
  // acked_size is the AUTHORITATIVE durable mirror size for this log: the
  // count of records the registry has verified and stored via
  // MirrorLogSegment. This is the shipper's resume cursor — see
  // GetMirrorState's own doc for why GetLogCheckpoint.size must never be
  // used as one.
  uint64 acked_size = 1;
}
