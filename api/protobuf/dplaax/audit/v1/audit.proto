// dplaax.audit.v1 is the read surface for the async chain auditor's per-head
// verdicts: a consumer fetches the latest recorded audit status for a consumed
// chain head (by content address). The verdict-producing runner is slice-17h;
// this is the read API (slice-17i).
//
// Coverage principle (load-bearing, slice-17i D-17i-2): the response carries a
// per-scope verdict, never a bare "overall" and never a top-level axes block. A
// linear-chain-only verdict can therefore never be read as a full aggregate
// (consumed-set) verdict — message presence of source_commitment IS the coverage
// signal (absent == not evaluated). A conforming aggregate consumer computes
// glb(linear_chain, source_commitment) and treats an absent source_commitment as
// not evaluated.
syntax = "proto3";

package dplaax.audit.v1;

option go_package = "github.com/provin-line/oss/gen/go/dplaax/audit/v1;auditpb";

import "o3co/authz/v1/policy.proto";

// AuditService serves the per-head audit verdict the async runner records. Its
// RPC declares its authorization policy (resource + action) via the
// o3co.authz.v1 method option; the network layer's interceptor enforces it. An
// absent option would silently disable the check, so the RPC carries one —
// asserted by a descriptor test.
service AuditService {
  // GetAuditStatus returns the latest recorded audit verdict for a consumed chain
  // head (by content address), or NotFound when no verdict has been recorded yet
  // (a well-formed head that has not been audited), or InvalidArgument for a
  // malformed content address. Audit verdicts are provenance metadata, L1-gated
  // like a VC read.
  rpc GetAuditStatus(GetAuditStatusRequest) returns (GetAuditStatusResponse) {
    option (o3co.authz.v1.policy) = {resource: "audit", action: "read"};
  }
  // ListAuditStatuses enumerates the recorded verdicts — the discovery
  // surface a relying party starts from ("what did my node audit"), where
  // GetAuditStatus is the point lookup for a hash already known. Ordering is
  // LEXICOGRAPHIC BY HEAD HASH, deliberately not temporal (stable under
  // concurrent inserts; time-range questions go through the filter fields).
  // Listings are not snapshots: an insert sorting before the cursor appears
  // only on a fresh listing. Same L1 gate as the point read — this widens
  // audit/read from point lookup to enumeration, which is the RPC's point;
  // nothing is served that GetAuditStatus would not serve the same bearer.
  rpc ListAuditStatuses(ListAuditStatusesRequest) returns (ListAuditStatusesResponse) {
    option (o3co.authz.v1.policy) = {resource: "audit", action: "read"};
  }
  // GetConsumedSources returns one page of the recorded receipt for a head:
  // the content addresses of the source credentials the emitting boundary
  // consumed (the emit-locus record, slice-17o). NotFound means NO RECEIPT
  // RECORDED FOR THIS HEAD ON THIS NODE — a coverage fact (the head's audit
  // here is linear-only), never a claim that the credential is intrinsically
  // linear; callers distinguishing "unknown head" from "linear coverage" use
  // GetAuditStatus. Paged because a consumed set has no bounded size (an
  // aggregate window folds every input); ordering is lexicographic (the
  // receipt is a set — storage order is not contractual). This is the
  // consumed-set exposure slice-17q deferred: it feeds independent
  // consume-locus verification, aggregate-complete archive export, and
  // recall joins across aggregate boundaries. Recall composition note: the
  // ListAuditStatuses × GetConsumedSources join is audited-head-complete —
  // a just-emitted head has a receipt but no verdict until the audit
  // runner's next tick.
  rpc GetConsumedSources(GetConsumedSourcesRequest) returns (GetConsumedSourcesResponse) {
    option (o3co.authz.v1.policy) = {resource: "audit", action: "read"};
  }
}

// Confidence is the wire projection of the verifier's three-state domain
// (vc.ConfidenceState). CONFIDENCE_UNSPECIFIED is the proto3 zero and the
// fail-closed sink: it is never emitted for a real linear-chain verdict, and a
// consumer treats it as not-verified. The domain's own zero is Failed, so the
// handler maps domain→proto with an explicit shift (Failed→FAILED), never a cast.
enum Confidence {
  CONFIDENCE_UNSPECIFIED = 0;
  CONFIDENCE_FAILED = 1;
  CONFIDENCE_INDETERMINATE = 2;
  CONFIDENCE_VERIFIED = 3;
}

// AxisVerdict carries the three normative confidence axes (mirrors vc.AxisResult).
message AxisVerdict {
  Confidence data_integrity = 1;
  Confidence signer_authenticity = 2;
  Confidence chain_consistency = 3;
}

// ScopeVerdict is one audited scope's verdict. axes is populated for scopes with
// sub-axis structure (the linear chain); a scope whose verifier yields a single
// state (source_commitment) leaves axes empty.
message ScopeVerdict {
  Confidence confidence = 1;
  AxisVerdict axes = 2;
  repeated string notations = 3;
}

message GetAuditStatusRequest {
  // head_hash is the consumed head's content address ("sha256:<hex>").
  string head_hash = 1;
}

message GetAuditStatusResponse {
  // linear_chain is the verdict over the previousCredential spine — always present
  // (every recorded audit walked the spine). Named by coverage so a reader can
  // never mistake it for a full aggregate verdict.
  ScopeVerdict linear_chain = 1;
  // source_commitment is the consumed-set (SourceCommitment) verdict. ABSENT until
  // the aggregate-audit slice — message presence IS the coverage signal (unset ==
  // not evaluated). A full aggregate "verified" requires this present AND VERIFIED;
  // a client reading only linear_chain can never mint one.
  ScopeVerdict source_commitment = 2;
  // audited_at is an RFC 3339 UTC timestamp string (display field; codebase
  // convention — dplaax.chain.v1 deliberately avoids google.protobuf.Timestamp).
  string audited_at = 3;
  // abandoned marks retries exhausted: the audit runner dropped this head and
  // will not re-audit it (a re-registration starts fresh and clears the flag).
  // A HEAD-LEVEL lifecycle fact, not a confidence: either scope's retry may be
  // the one that ran out — inspect linear_chain / source_commitment for the
  // verdicts themselves. false == the head may still be re-audited.
  bool abandoned = 4;
}

// Pagination contract (repo convention, set here by the first paged RPCs):
// page_size 0 = server default (64), negative = InvalidArgument, above the
// server maximum (256) = clamped, never an error. page_token is OPAQUE and
// versioned; a malformed token, an unversioned token, or a token issued for
// different filter fields is InvalidArgument. The cursor advances by SCAN
// progress, not by matches: a filtered page may legally return fewer than
// page_size entries — even zero — with a non-empty next_page_token, so a
// filtered listing can never livelock; clients loop until next_page_token
// comes back empty.
message ListAuditStatusesRequest {
  int32 page_size = 1;
  string page_token = 2;
  // audited_after / audited_before (optional, RFC 3339 UTC) bound the
  // verdict timestamps; malformed values are InvalidArgument. Applied while
  // scanning in hash order (there is no temporal index — a filtered listing
  // scans; the token stays opaque so an index can change that freely).
  string audited_after = 3;
  string audited_before = 4;
}

// AuditStatusEntry is one enumerated head. status embeds the point-lookup
// response: it is exactly the per-head status payload (asserted by the
// coverage principle above), so embedding keeps ONE source of truth for the
// verdict shape and its frozen semantics. Guard rule that keeps this sound:
// GetAuditStatusResponse must stay pure per-head status — any future
// point-read-only data goes in a new field/message, never into it.
message AuditStatusEntry {
  string head_hash = 1;
  // status is the recorded verdict — absent when damaged is true.
  GetAuditStatusResponse status = 2;
  // damaged marks a head whose recorded verdict could not be read back
  // intact. The head stays ENUMERABLE — a listing must not present damage
  // as absence, and one damaged record must not deny discovery of
  // everything sorting after it — but the verdict itself is unavailable
  // (a point GetAuditStatus for this head errors). Never set silently:
  // the node logs the damage when serving it. A damaged entry ignores the
  // time filters (it has no readable timestamp; a caller narrowing by time
  // must still learn that part of the record set is unreadable).
  bool damaged = 3;
}

message ListAuditStatusesResponse {
  repeated AuditStatusEntry entries = 1;
  // An empty next_page_token means the listing is exhausted. (The converse
  // is not guaranteed: the cursor tracks SCAN progress, so when the store
  // size is an exact multiple of the scan budget the final token yields one
  // trailing empty page — loop until the token comes back empty.)
  string next_page_token = 2;
}

message GetConsumedSourcesRequest {
  // head_hash is the emitted head's content address ("sha256:<hex>").
  string head_hash = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message GetConsumedSourcesResponse {
  // consumed is one page of the receipt's source content addresses,
  // lexicographic. Never an empty first page: an absent receipt is NotFound,
  // and a recorded receipt is never empty (all-consumed semantics include
  // the triggering predecessor's issuer).
  repeated string consumed = 1;
  string next_page_token = 2;
}
