# Quickstart overlay for the generated auth.provider, loaded over
# application.conf because compose sets CONFIG_ENV=quickstart.
#
# The DID grant issues a token only for an audience on this list, and the
# policy-verifier accepts a token only when its aud equals the verifier's
# OAUTH_JWT_AUDIENCE. Both read the same variable, which compose always sets
# (default https://quickstart.provin.invalid).
#
# The substitution is required, and written directly in the array, on
# purpose. The provider's HOCON parser (@o3co/ts.hocon 0.1.5) turns an
# optional ${?VAR} inside an array into null even when VAR is set, and a
# ${path} reference inside an array into an object rather than a string —
# both fail the config schema. A provider started without the variable
# fails at boot instead of allowing the wrong audience.
# Dev/evaluation only.
oauth.grants.did.allowedAudiences = [${OAUTH_JWT_AUDIENCE}]
