# dPLaaX self-host quickstart — a full authenticated stack in one command:
#
#   docker compose up --build
#
# Topology: the separated dplaax topology (cmd/network control plane +
# cmd/pipeline data plane, PR3c — the retired cmd/standalone combined both)
# behind the REAL three-layer auth stack — an auth.provider (JWT issuance)
# and an o3co policy-verifier (the PDP: JWT verification + policy), over a
# NATS broker. The `provision` init container generates the NATS
# operator-mode trust material AND the pipeline's own local signing keys
# first; nothing cryptographic is committed to the repo.
#
# Dev/evaluation only — NOT a production reference. It shares one HS256
# secret across the auth layer and runs everything on one host; see the
# README.

name: dplaax-quickstart

services:
  # One-shot: generate NATS trust material, the pipeline's service-token
  # overlay, and the pipeline's local #auth/#signing keys (the external-key
  # provisioning story — see README) into the shared volumes, then exit.
  provision:
    build:
      context: ../..
      dockerfile: deploy/quickstart/provision.Dockerfile
    environment:
      # The pipeline's service token is HS256-signed with the same shared
      # secret the provider/verifier use, so it mints against the same value.
      OAUTH_JWT_SECRET: ${OAUTH_JWT_SECRET:-quickstart-dev-secret-change-me}
      OAUTH_JWT_ISSUER: ${OAUTH_JWT_ISSUER:-http://auth-provider:3000}
    volumes:
      - provisioned:/provisioned
      - pipeline-data:/pipeline-data

  nats:
    # Pinned to the same server line the repo's broker-contract tests run
    # against (the claims-update API the pipeline's live push depends on).
    image: nats:2.12.6
    # Same uid as the network/pipeline images (their Dockerfiles): the
    # broker's directory resolver and each node's DirPublisher both rewrite
    # account JWTs in the shared resolver dir, so they must share ownership
    # (provision chowns the dir to this uid).
    user: "10001"
    command: ["-c", "/provisioned/nats/nats-server.conf"]
    volumes:
      - provisioned:/provisioned
    ports:
      - "8222:8222" # monitoring (optional)
    depends_on:
      provision:
        condition: service_completed_successfully

  # PDP: verifies the caller's JWT (HS256, shared secret) and evaluates policy.
  # Published by provin.auth's publish-images workflow (an immutable sha- tag;
  # bump deliberately). While provin.auth is private the pull needs
  # `docker login ghcr.io` with a token that can read the org's packages.
  # Building from source instead: swap `image:` for the commented build block
  # (needs $GITHUB_TOKEN as a BuildKit secret; see policy-verifier.Dockerfile).
  policy-verifier:
    image: ghcr.io/provin-line/auth-policy-verifier:v0.1.0
    # build:
    #   context: .
    #   dockerfile: policy-verifier.Dockerfile
    #   secrets:
    #     - github_token
    environment:
      OAUTH_JWT_ALGORITHM: HS256
      OAUTH_JWT_SECRET: ${OAUTH_JWT_SECRET:-quickstart-dev-secret-change-me}
      HTTP_PORT: "3001"
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  # JWT issuer: mints tokens from the DID grant (owner-key-signed assertion).
  # Same image-vs-source choice as policy-verifier above. The image's
  # scaffold-time --registry-base-url is a placeholder; the env below
  # overrides it at runtime (the image is deployment-generic).
  auth-provider:
    image: ghcr.io/provin-line/auth-auth-provider:v0.1.0
    # build:
    #   context: .
    #   dockerfile: auth-provider.Dockerfile
    #   secrets:
    #     - github_token
    environment:
      OAUTH_JWT_ALGORITHM: HS256
      OAUTH_JWT_SECRET: ${OAUTH_JWT_SECRET:-quickstart-dev-secret-change-me}
      OAUTH_JWT_ISSUER: ${OAUTH_JWT_ISSUER:-http://auth-provider:3000}
      HTTP_PORT: "3000"
      # The provider resolves the owner DID against the network (registry)
      # during a DID grant. Reach it at its registry-id alias so the DID's
      # {registry} segment ("poc.dplaax.dev") matches the base URL host — no
      # allowedRegistries override needed (that env override injects a
      # string where the config schema wants an array).
      DPLAAX_REGISTRY_BASE_URL: http://poc.dplaax.dev:8443
      # Custom DID grant is not OIDC; allow the non-OIDC token path.
      OAUTH_OIDC_MODE: dual
    volumes:
      - ./auth-provider/clients.yaml:/app/config/clients.yaml:ro
    ports:
      - "3000:3000"
    depends_on:
      network:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/_healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Control plane: DID/Schema/Signer/VC/Audit/Chain registry RPCs, the
  # background batch-resolver + audit-runner, and public DID resolution. No
  # data plane — see cmd/network's own package doc (it refuses to boot with
  # any loop configured).
  network:
    build:
      context: ../..
      dockerfile: cmd/network/Dockerfile
    environment:
      # cmd/network's own peer-fetching batch resolver (BuildBatchResolver)
      # always runs and always presents provin.network.pipeline.vc-store-bearer
      # against L1-protected peer ResolveVC endpoints — the SAME service token
      # `provision` mints for `pipeline`. Without this overlay the placeholder
      # in network/config/application.conf stands, and every peer fetch is
      # rejected 401/403 (see hoconconfig.Load's CONFIG_OVERLAY layer, and
      # cmd/network's own boot guard on an empty bearer).
      CONFIG_OVERLAY: /provisioned/overlay.conf
    volumes:
      - ./network/config:/app/config:ro
      - provisioned:/provisioned
    networks:
      default:
        # The provider resolves owner DIDs at http://poc.dplaax.dev:8443; that
        # host must equal the DID's {registry} segment, so alias this
        # service to it.
        aliases:
          - poc.dplaax.dev
    ports:
      # Loopback-only publish: every documented flow talks to localhost, and
      # this service serves the unauthenticated /metrics endpoint (enabled
      # in this stack's application.conf) — publishing on all host
      # interfaces would leak it to the host's network.
      - "127.0.0.1:8443:8443"
    # Without this, `up --wait` cannot tell a serving node from one that is
    # crash-looping behind `restart: on-failure` — a restarting container is
    # still "running", so the stack reported ready while the node had never
    # booted at all (found by the P0-6 actual-boot condition, cmd/standalone
    # era). /readyz is this service's own readiness verdict, so waiting on it
    # is waiting on the thing that matters.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8443/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: on-failure
    depends_on:
      provision:
        condition: service_completed_successfully
      nats:
        condition: service_started
      policy-verifier:
        condition: service_healthy

  # Data plane: the configured transport loops (src push-ingress, archive
  # observation-only sink), wire-composed against `network` — it carries NO
  # in-process registry of its own (cmd/pipeline's own package doc). Its
  # local signing keys (external-key provisioning) come from the
  # `pipeline-data` volume `provision` wrote them into BEFORE this service's
  # first boot; its NATS trust material and service-token overlay come from
  # the shared `provisioned` volume, same as `network`.
  pipeline:
    build:
      context: ../..
      dockerfile: cmd/pipeline/Dockerfile
    environment:
      CONFIG_FILE: /app/config/application.conf
    volumes:
      - ./pipeline/config:/app/config:ro
      - provisioned:/provisioned
      - pipeline-data:/app/data
    ports:
      # A SEPARATE host port from network's 8443: these are two independent
      # processes now, each with its own :8443 internal listener. Loopback-
      # only publish, same rationale as network's port above (this service
      # also serves /metrics, and /ingest/src/push is L1-gated but still not
      # meant for the open host network in a dev stack).
      - "127.0.0.1:8444:8443"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8443/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: on-failure
    depends_on:
      provision:
        condition: service_completed_successfully
      nats:
        condition: service_started
      network:
        condition: service_healthy

volumes:
  provisioned:
  pipeline-data:

# GitHub token for cloning the (currently private) provin.auth — only needed
# when building policy-verifier / auth-provider FROM SOURCE (the commented
# build blocks above) instead of pulling the published images. Read from
# $GITHUB_TOKEN; harmless to leave defined while unused, inert once the repos
# are public.
secrets:
  github_token:
    environment: GITHUB_TOKEN
