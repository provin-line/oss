# Quickstart standalone node config (dev/evaluation — NOT a production
# reference). It mirrors the provin.e2e httpingest topology (one source loop
# fed over HTTP push, one observing sink) but points authorization at the REAL
# policy-verifier instead of an allow-all stub, and takes its NATS trust
# material from the generated/ directory the `provision` step writes.
#
# Anything security-sensitive here (single shared HS256 secret at the auth
# layer, loopback-friendly networking) is a dev simplification; see the README
# "Not a production reference" note.

provin.network {
  core {
    # All-interfaces inside the container: other compose services reach the
    # node at node:8443, and the host publish is loopback-only (127.0.0.1,
    # docker-compose.yml). This is a NON-loopback cleartext listener, so the
    # transport-posture guard requires an explicit acknowledgement below.
    listen-addr = ":8443"
    data-dir    = "/app/data"
    # Dev quickstart serves cleartext h2c on a trusted compose bridge (no TLS
    # terminator). Honest acknowledgement — production MUST use tls.cert-file/
    # key-file or a real TLS terminator with an isolated backend.
    tls.allow-cleartext = true
    # Container network: peers are reached by private-range service IPs.
    dev.allow-loopback     = false
    allow-private-networks = true
    # Unauthenticated /metrics (emit/verify/audit counters) — default-off in
    # reference.conf; enabled here because the compose publishes the node port
    # loopback-only (127.0.0.1, see docker-compose.yml) and out-of-the-box
    # observability is the quickstart's point:
    #   curl http://localhost:8443/metrics
    metrics.enabled = true
  }

  # REAL authorization decision point — the o3co policy-verifier instance in
  # this compose stack (backend = o3co is the default). It verifies the caller's
  # JWT (HS256, shared secret) and evaluates the declared policy surface.
  auth.policy-verifier-url = "http://policy-verifier:3001"

  registry {
    # The did:dplaax {registry} segment this node is authoritative for; appears
    # in every DID it mints and resolves. The compose file aliases this node to
    # `poc.dplaax.dev` and points the auth.provider's resolver base URL there, so
    # the DID's {registry} segment matches the resolver host directly (no
    # allowed-registries override needed).
    id = "poc.dplaax.dev"
    # Service endpoints embedded in every DID Document this node issues:
    # the normative derivations relying parties use to find live evidence.
    # http://node:8443 is canonical INSIDE the compose network; a host-run
    # CLI reaches the same services by overriding, e.g.
    #   --did-base         poc.dplaax.dev=http://localhost:8443
    #   --vc-resolver-base poc.dplaax.dev=http://localhost:8443
    #   --audit-base       poc.dplaax.dev=http://localhost:8443
    service-endpoints {
      vc-resolver { type = "VCResolver",   url = "http://node:8443" }
      audit       { type = "AuditService", url = "http://node:8443" }
    }
  }

  chain {
    transport = "nats"
    nats {
      url                  = "nats://nats:4222"
      # NATS trust material from the `provision` step, shared via the
      # `provisioned` volume mounted at /provisioned in this container.
      account-seed-file    = "/provisioned/acme-account.seed"
      trust-root-seed-file = "/provisioned/operator.seed"
      resolver-dir         = "/provisioned/jwts"
      # System-account user for the live claims push: grants issued to the
      # running stack take effect without a broker restart. The user is
      # narrowed to this account's claims-update subject (see provision).
      sys-user-jwt-file    = "/provisioned/sys-user.jwt"
      sys-user-seed-file   = "/provisioned/sys-user.seed"
      node-did             = "did:dplaax:poc.dplaax.dev:org:acme"
      resolver-base-url    = "http://node:8443"
    }
  }

  pipeline {
    # The node hosts the VC store this deployment reads/writes against. The
    # store endpoint is L1-gated like any RPC, so the node authenticates its own
    # publish / resolve / adjacent-fetch calls with a service token. That token
    # is minted by the `provision` step (HS256, shared secret) and injected here
    # via the CONFIG_OVERLAY file (generated/overlay.conf) — this base value is a
    # deliberately invalid placeholder so a missing overlay fails loud, never
    # silently sends an unauthenticated bearer.
    vc-store-endpoint = "http://node:8443"
    vc-store-bearer   = "OVERRIDDEN_BY_CONFIG_OVERLAY"

    loops {
      # Source loop: accepts records over HTTP push at /ingest/src/push, signs
      # each as the process DID s1, and emits onto the readings chain subject.
      # The process DID's signing key is minted + held by this node's registry
      # (KMS model) once `provin process create` issues it — until then the
      # loop idles.
      src {
        role            = "source"
        ingress-subject = "ingest.readings"
        push-ingress    = true
        output-subject  = "did:dplaax:poc.dplaax.dev:org:acme:pipeline:readings"
        issuer {
          did                 = "did:dplaax:poc.dplaax.dev:org:acme:pipeline:readings:process:s1"
          key-id              = "signing"
          verification-method = "did:dplaax:poc.dplaax.dev:org:acme:pipeline:readings:process:s1#signing"
        }
        pipeline-id          = "readings"
        process-id           = "s1"
        transformation-claim = "convert"
      }
      # Sink loop: observes the readings subject and verifies each pass credential
      # against the adjacent (upstream) evidence, producing the audit status the
      # walkthrough queries.
      archive {
        role            = "sink"
        ingress-subject = "did:dplaax:poc.dplaax.dev:org:acme:pipeline:readings"
        sink {
          kind                  = "observation-only"
          verification-strategy = "adjacent"
          upstream-endpoint     = "http://node:8443"
        }
      }
    }

    batch-resolver { interval = 1s, batch-size = 64, max-retries = 5, max-depth = 1024 }
    audit-runner   { interval = 1s, batch-size = 64, max-attempts = 10 }
  }
}
