# Quickstart network (control-plane) config — dev/evaluation only, NOT a
# production reference. This is the registry half of the separated topology
# (cmd/network + cmd/pipeline): DID/Schema/Signer/VC/Audit/Chain services,
# the background batch-resolver + audit-runner, and the public W3C DID
# resolution route. It carries NO data plane — cmd/network refuses to boot if
# provin.network.pipeline.loops is non-empty, so this file deliberately has
# no loops block (that lives only in ../../pipeline/config/application.conf).
#
# Layout mirrors provin.e2e's own migrated compose scenarios (e.g.
# scenarios/httpingest's acme-network/config/application.conf) — the
# reference for how this repo's OWN e2e harness already runs cmd/network +
# cmd/pipeline as two processes talking only over the wire.
#
# Anything security-sensitive here (single shared HS256 secret at the auth
# layer, loopback-friendly networking) is a dev simplification; see the
# README "Not a production reference" note.

provin.network {
  core {
    # All-interfaces inside the container: other compose services reach this
    # node at network:8443, and the host publish is loopback-only (127.0.0.1,
    # docker-compose.yml). This is a NON-loopback cleartext listener, so the
    # transport-posture guard requires an explicit acknowledgement below.
    listen-addr = ":8443"
    data-dir    = "/app/data"
    # Dev quickstart serves cleartext h2c on a trusted compose bridge (no TLS
    # terminator). Honest acknowledgement — production MUST use tls.cert-file/
    # key-file or a real TLS terminator with an isolated backend.
    tls.allow-cleartext = true
    # Container network: peers (pipeline, the other compose services) are
    # reached by private-range service IPs — mirrors provin.e2e's own
    # migrated compose configs (allow-private-networks = true there too).
    dev.allow-loopback     = false
    allow-private-networks = true
    # Unauthenticated /metrics (this binary's own audit-verdict counters) —
    # default-off in reference.conf; enabled here because the compose
    # publishes this node's port loopback-only (127.0.0.1, see
    # docker-compose.yml) and out-of-the-box observability is the
    # quickstart's point: curl http://localhost:8443/metrics
    metrics.enabled = true
  }

  # REAL authorization decision point — the o3co policy-verifier instance in
  # this compose stack (backend = o3co is the default). It verifies the
  # caller's JWT (HS256, shared secret) and evaluates the declared policy
  # surface.
  auth.policy-verifier-url = "http://policy-verifier:3001"

  registry {
    # The did:dplaax {registry} segment this node is authoritative for; appears
    # in every DID it mints and resolves. The compose file aliases this
    # service to `poc.dplaax.dev` and points the auth.provider's resolver
    # base URL there, so the DID's {registry} segment matches the resolver
    # host directly (no allowed-registries override needed).
    id = "poc.dplaax.dev"
    # Service endpoints embedded in every DID Document this node issues: the
    # normative derivations relying parties use to find live evidence. Both
    # point at THIS service (network hosts VCResolver/AuditService, never
    # pipeline — pipeline is a wire CLIENT to them). http://network:8443 is
    # canonical INSIDE the compose network; a host-run CLI reaches the same
    # services by overriding, e.g.
    #   --did-base         poc.dplaax.dev=http://localhost:8443
    #   --vc-resolver-base poc.dplaax.dev=http://localhost:8443
    #   --audit-base       poc.dplaax.dev=http://localhost:8443
    service-endpoints {
      vc-resolver { type = "VCResolver",   url = "http://network:8443" }
      audit       { type = "AuditService", url = "http://network:8443" }
    }
  }

  chain {
    transport = "nats"
    nats {
      url                  = "nats://nats:4222"
      # NATS trust material from the `provision` step, shared via the
      # `provisioned` volume mounted at /provisioned in this container.
      account-seed-file    = "/provisioned/acme-account.seed"
      trust-root-seed-file = "/provisioned/operator.seed"
      resolver-dir         = "/provisioned/jwts"
      # System-account user for the live claims push: grants issued to the
      # running stack take effect without a broker restart. The user is
      # narrowed to this account's claims-update subject (see provision).
      sys-user-jwt-file    = "/provisioned/sys-user.jwt"
      sys-user-seed-file   = "/provisioned/sys-user.seed"
      # Shared with pipeline's own config (chainconfig.LoadChainConfig
      # requires a non-empty node-did on the nats transport on both sides;
      # this binary does not otherwise act as that identity — see the
      # pipeline config's own doc for what actually signs as it).
      node-did             = "did:dplaax:poc.dplaax.dev:org:acme:pipeline:readings:process:s1"
      resolver-base-url    = "http://network:8443"
    }
  }

  pipeline {
    # cmd/network's own batch-resolver (below) ALWAYS runs and presents this
    # bearer against L1-protected peer ResolveVC endpoints (main.go's boot
    # guard requires it non-empty for exactly that reason) — this is not a
    # dead config key. Deliberately invalid placeholder: the compose file's
    # CONFIG_OVERLAY (docker-compose.yml) points this node at
    # /provisioned/overlay.conf, the SAME service-token overlay `provision`
    # mints for `pipeline`, which sets the real value at container start. A
    # missing overlay (e.g. this file parsed standalone, outside the
    # container — TestShippedConfigsParse) leaves this placeholder standing,
    # which fails a real wire call loud (401) rather than parsing.
    vc-store-endpoint = "http://network:8443"
    vc-store-bearer   = "OVERRIDDEN_BY_PROVISIONED_OVERLAY"

    # Only cmd/network runs these two background runners — the data-plane
    # loops themselves live in ../../pipeline/config/application.conf, never
    # here (this binary refuses to boot with any loop configured).
    batch-resolver { interval = 1s, batch-size = 64, max-retries = 5, max-depth = 1024 }
    audit-runner   { interval = 1s, batch-size = 64, max-attempts = 10 }
  }
}
