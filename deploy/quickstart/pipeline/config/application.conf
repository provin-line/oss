# Quickstart pipeline (data-plane) config — dev/evaluation only, NOT a
# production reference. This is the cmd/pipeline half of the separated
# topology: it carries NO in-process registry (every wire dependency — VC
# store, audit, schema, payload — is a network client pointed at
# ../../network/config/application.conf's node), and mounts ONLY /healthz,
# /readyz, /metrics (when enabled), and the configured /ingest/<loop>/...
# push routes. cmd/pipeline reads this file via the REQUIRED CONFIG_FILE
# environment variable (docker-compose.yml), never the ./config/
# application.conf + CONFIG_OVERLAY layering cmd/network uses.
#
# It mirrors the provin.e2e httpingest topology (one source loop fed over
# HTTP push, one observing sink) — the reference for how this repo's OWN e2e
# harness already runs cmd/network + cmd/pipeline as two processes talking
# only over the wire (scenarios/httpingest's acme-pipeline/config/
# application.conf).
#
# Anything security-sensitive here (single shared HS256 secret at the auth
# layer, loopback-friendly networking) is a dev simplification; see the
# README "Not a production reference" note.

provin.network {
  core {
    # All-interfaces inside the container: other compose services reach this
    # node at pipeline:8443, and the host publish is loopback-only
    # (127.0.0.1, docker-compose.yml). This is a NON-loopback cleartext
    # listener, so the transport-posture guard requires an explicit
    # acknowledgement below.
    listen-addr = ":8443"
    # The pipeline-data volume: provision (the init container) mints this
    # deployment's #auth/#signing keys directly into data-dir/keys BEFORE
    # this binary's first boot (see provision/main.go's
    # provisionPipelineIdentity) — cmd/pipeline's own boot preflights
    # (wiring.go: preflightPayloadRetainKeys, preflightWireOnlySignerKeys)
    # fail closed at startup if a needed key is missing, so the keys must
    # already be in place, not issued later.
    data-dir    = "/app/data"
    # Dev quickstart serves cleartext h2c on a trusted compose bridge (no TLS
    # terminator). Honest acknowledgement — production MUST use tls.cert-file/
    # key-file or a real TLS terminator with an isolated backend.
    tls.allow-cleartext = true
    # Container network: peers (network, the other compose services) are
    # reached by private-range service IPs — mirrors provin.e2e's own
    # migrated compose configs (allow-private-networks = true there too).
    dev.allow-loopback     = false
    allow-private-networks = true
    # Unauthenticated /metrics (this binary's own emit/verify counters, no
    # audit-verdict family — cmd/pipeline runs no audit runner) — default-off
    # in reference.conf; enabled here because the compose publishes this
    # node's port loopback-only (127.0.0.1, see docker-compose.yml) and
    # out-of-the-box observability is the quickstart's point:
    #   curl http://localhost:8444/metrics
    metrics.enabled = true
  }

  # REAL authorization decision point — the o3co policy-verifier instance in
  # this compose stack (backend = o3co is the default). It verifies the
  # caller's JWT (HS256, shared secret) and evaluates the declared policy
  # surface for this binary's push-ingress route.
  auth.policy-verifier-url = "http://policy-verifier:3001"

  chain {
    transport = "nats"
    nats {
      url                  = "nats://nats:4222"
      # NATS trust material from the `provision` step, shared via the
      # `provisioned` volume mounted at /provisioned in this container —
      # the SAME material ../../network/config/application.conf reads.
      account-seed-file    = "/provisioned/acme-account.seed"
      trust-root-seed-file = "/provisioned/operator.seed"
      resolver-dir         = "/provisioned/jwts"
      sys-user-jwt-file    = "/provisioned/sys-user.jwt"
      sys-user-seed-file   = "/provisioned/sys-user.seed"
      # This deployment's node identity: RegisterAuditHead and every durable
      # custody log's checkpoint signer sign as this DID — the SAME identity
      # as the src loop's issuer, below, so provisioning needs only one
      # local keyset (provision/main.go's provisionPipelineIdentity).
      node-did             = "did:dplaax:poc.dplaax.dev:org:acme:pipeline:readings:process:s1"
      resolver-base-url    = "http://network:8443"
    }
  }

  pipeline {
    # The registry this deployment's loops publish to / resolve against —
    # cmd/network's own service, never this binary (cmd/pipeline carries no
    # in-process registry).
    vc-store-endpoint = "http://network:8443"
    # Deliberately invalid placeholder: provision's service-token overlay
    # (below) sets the real value, so a missing overlay fails loud at first
    # wire call rather than silently sending an unauthenticated bearer.
    vc-store-bearer   = "OVERRIDDEN_BY_PROVISIONED_OVERLAY"

    loops {
      # Source loop: accepts records over HTTP push at /ingest/src/push, signs
      # each as the process DID s1, and emits onto the readings chain subject.
      # The process DID's #signing key lives in THIS binary's own local
      # keystore (provision/main.go's provisionPipelineIdentity) — the
      # external-key issuance path: the registry never generates or holds
      # it (see ../../README.md's provisioning walkthrough).
      src {
        role            = "source"
        ingress-subject = "ingest.readings"
        push-ingress    = true
        output-subject  = "did:dplaax:poc.dplaax.dev:org:acme:pipeline:readings"
        issuer {
          did                 = "did:dplaax:poc.dplaax.dev:org:acme:pipeline:readings:process:s1"
          key-id              = "signing"
          verification-method = "did:dplaax:poc.dplaax.dev:org:acme:pipeline:readings:process:s1#signing"
        }
        pipeline-id          = "readings"
        process-id           = "s1"
        transformation-claim = "convert"
      }
      # Sink loop: observes the readings subject and verifies each pass
      # credential against the adjacent (upstream) evidence — fetched from
      # the registry (network), never from this binary itself — producing
      # the audit status the walkthrough queries.
      archive {
        role            = "sink"
        ingress-subject = "did:dplaax:poc.dplaax.dev:org:acme:pipeline:readings"
        sink {
          kind                  = "observation-only"
          verification-strategy = "adjacent"
          upstream-endpoint     = "http://network:8443"
        }
      }
    }
  }
}

# The node's service token (HS256, minted by the `provision` step from the
# shared secret) — this binary uses it to authenticate its OWN L1-gated
# calls to the registry (publishing issued VCs, resolving references,
# fetching adjacent evidence), which the real policy-verifier authorizes
# just like any external caller. A NON-required include: TestShippedConfigsParse
# (deploy/quickstart/config_parse_test.go) parses this file outside any
# running container, where /provisioned never exists — the placeholder above
# then stands, which fails a real wire call loud (401) rather than parsing.
# Inside the real compose stack this file is always present by the time this
# binary boots (docker-compose.yml: this service depends on `provision`
# completing AND on `network` being healthy, and network itself cannot
# become healthy before `provision` completes).
include "/provisioned/overlay.conf"
