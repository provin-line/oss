# Runs provin.e2e's black-box scenarios against THIS commit.
#
# This is the direction that prevents product regressions from shipping. The
# e2e repository has its own CI, but that one holds oss still at a pinned
# revision and varies the harness — it can only catch "an e2e change broke
# against known-good oss". Nothing there runs when oss changes. Without the job
# below, an oss commit could break every scenario and no gate would notice.
#
# The pairing is deliberately asymmetric:
#
#   - the harness is PINNED (E2E_REF), so a red run here means THIS commit
#     broke something, not that someone edited a test five minutes ago;
#   - oss is whatever is being proposed, checked out by the triggering event.
#
# So `make verify-pin` is NOT run: that target asserts repos/oss matches the
# harness's own pin, which is exactly what this job deliberately violates.
#
# Bumping E2E_REF is deliberate work, same discipline as the harness's own
# pins.env: read what changed in the harness, run both jobs, then commit the new
# SHA. The pin used to live in this file's env: block on the grounds that it had
# exactly one reader. It now lives in ./pins.env — not because a second pin
# appeared, but because nothing automated can edit a pin inside a workflow file
# (GITHUB_TOKEN has no `workflows` scope), and a pin only a human can move goes
# stale. e2e-pin-bump.yml maintains it; pins.env states what that cost.
#
# Every action here is pinned to a commit SHA, unlike this repository's other
# workflows. The original reason was that these steps handled a GitHub App
# private key; they no longer do — provin-line/e2e went public on 2026-07-27
# and the harness checkout is anonymous. The pins stay anyway. Unpinning is a
# regression on its own terms (a tag is mutable), and this is the one workflow
# here that runs a fork's proposed code, so the actions it invokes should not
# be able to change underneath it.
#
# Cost: the compose job builds two images and runs eleven container stacks
# serially, so it is the slowest thing in this repository's CI by a wide margin.
# It is required anyway — the two runtimes are equivalent by rule (the harness's
# AGENTS.md rule 3) and gating only the cheap one would let the container half
# rot. Narrow it with evidence about what it stops catching, never to save time
# on principle.
name: e2e

on:
  push:
    branches: [poc, main]
  pull_request:

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      # Both repositories go in subdirectories so the harness's repos/oss can be
      # a sibling symlink. Checking oss out at the workspace root instead would
      # make repos/oss point at a tree containing the harness itself, and the
      # docker build context would swallow it.
      - name: checkout this oss commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: oss
      # pins.env says in prose that a pin is a SHA and never a branch name; this
      # makes that enforceable rather than aspirational. It matters more here
      # than in the harness's mirror of it: this workflow runs on pull requests,
      # including from forks, and pins.env is an ordinary file a pull request can
      # edit. Exactly one E2E_REF line is accepted — `sed -n p` prints every
      # match and a validator that checks "some line is a SHA" while a checkout
      # consumes a different line is two behaviours wearing one assertion.
      # This cannot stop a pull request from naming an OLDER harness — see
      # pins.env on why that is a review question, not one a workflow can
      # answer. What it names is verified AFTER checkout, below.
      - id: pin
        name: read and validate the harness pin
        run: |
          count=$(grep -c '^E2E_REF=' oss/pins.env || true)
          if [ "$count" != "1" ]; then
            echo "pins.env: expected exactly one E2E_REF= line, found $count"
            exit 1
          fi
          ref=$(sed -n 's/^E2E_REF=//p' oss/pins.env | head -1)
          printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "pins.env: E2E_REF must be a full 40-character commit SHA, got '$ref'"
            exit 1
          }
          echo "e2e_ref=$ref" >> "$GITHUB_OUTPUT"
      # No credential: provin-line/e2e is public, so an anonymous checkout
      # reaches it. This used to mint a GitHub App installation token because
      # GITHUB_TOKEN is scoped to this repository and could not read a private
      # sibling — which is also why these jobs used to skip themselves on fork
      # pull requests, a fork getting no secrets. Both went away with the
      # harness's visibility on 2026-07-27.
      - name: checkout the pinned harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: provin-line/e2e
          ref: ${{ steps.pin.outputs.e2e_ref }}
          path: e2e
          # Still false: checkout defaults to persisting GITHUB_TOKEN in the
          # clone's git config, and this clone has no use for it.
          persist-credentials: false
      # The harness's own ci.yml re-asserts its checkout with `make verify-pin`;
      # this is that backstop, pointed at this job's checkout. It makes the
      # whole class of "the validator passed but the checkout landed somewhere
      # else" dead rather than each instance patched: whatever string tricks
      # survive the step above, the suite only runs if the tree IS the pinned
      # revision.
      - name: verify the harness landed on the pin
        env:
          EXPECTED: ${{ steps.pin.outputs.e2e_ref }}
        run: |
          have=$(git -C e2e rev-parse HEAD)
          [ "$have" = "$EXPECTED" ] || {
            echo "e2e checkout is at $have but pins.env names $EXPECTED"
            exit 1
          }
      - name: point the harness at this oss checkout
        run: |
          mkdir -p e2e/repos
          ln -sfn ../../oss e2e/repos/oss
          test -e e2e/repos/oss/go.mod || { echo "symlink does not resolve to an oss checkout"; exit 1; }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: e2e/go.mod
          cache: true
          cache-dependency-path: e2e/go.sum
      - name: report the pair under test
        run: |
          echo "oss (this commit):   $(git -C oss rev-parse HEAD)"
          echo "e2e (pinned):        $(git -C e2e rev-parse HEAD)"
      # No nats-server install: the harness starts the real server in-process
      # from the nats-server/v2 module.
      - name: run the scenarios (process runtime)
        working-directory: e2e
        run: make test

  compose:
    runs-on: ubuntu-latest
    steps:
      - name: checkout this oss commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: oss
      - id: pin
        name: read and validate the harness pin
        run: |
          count=$(grep -c '^E2E_REF=' oss/pins.env || true)
          if [ "$count" != "1" ]; then
            echo "pins.env: expected exactly one E2E_REF= line, found $count"
            exit 1
          fi
          ref=$(sed -n 's/^E2E_REF=//p' oss/pins.env | head -1)
          printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "pins.env: E2E_REF must be a full 40-character commit SHA, got '$ref'"
            exit 1
          }
          echo "e2e_ref=$ref" >> "$GITHUB_OUTPUT"
      - name: checkout the pinned harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: provin-line/e2e
          ref: ${{ steps.pin.outputs.e2e_ref }}
          path: e2e
          persist-credentials: false
      - name: verify the harness landed on the pin
        env:
          EXPECTED: ${{ steps.pin.outputs.e2e_ref }}
        run: |
          have=$(git -C e2e rev-parse HEAD)
          [ "$have" = "$EXPECTED" ] || {
            echo "e2e checkout is at $have but pins.env names $EXPECTED"
            exit 1
          }
      - name: point the harness at this oss checkout
        run: |
          mkdir -p e2e/repos
          ln -sfn ../../oss e2e/repos/oss
          test -e e2e/repos/oss/go.mod || { echo "symlink does not resolve to an oss checkout"; exit 1; }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: e2e/go.mod
          cache: true
          cache-dependency-path: e2e/go.sum
      - name: report the pair under test
        run: |
          echo "oss (this commit):   $(git -C oss rev-parse HEAD)"
          echo "e2e (pinned):        $(git -C e2e rev-parse HEAD)"
      # Builds cmd/network and cmd/pipeline images FROM THIS COMMIT, which is
      # what makes the container half of this gate meaningful.
      - name: build the node images from this commit
        working-directory: e2e
        run: make docker-build
      - name: run the scenarios (compose runtime)
        working-directory: e2e
        run: make test-compose
