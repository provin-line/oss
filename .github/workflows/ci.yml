name: ci

on:
  push:
    branches: [poc, main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}
      - name: build
        run: make build
      # make lint = go vet + buf lint + scripts/check-*.sh hygiene (gofmt,
      # canonicalizer, decoder). buf-setup provides the buf toolchain the
      # proto-lint step needs.
      - name: lint
        run: make lint
      - name: test
        run: go test ./...

  # The conformance harness is a separate required job so a red here is
  # unambiguous — a vector regression or a newly-synced-but-undriven vector
  # is not buried in the general test output. Runs the full conformance package,
  # which is BOTH catalogs: dPLaaX owns the wire (TestDplaaxAllVectors +
  # TestDplaaxVendoredManifest) and the provin profile owns what a claim asserts
  # (TestProvinProfileAllVectors + TestProvinProfileVendoredManifest), each with
  # its own coverage guard and byte-exact pin. Plus TestCheckCoverage. So if
  # branch protection marks only this job required, every manifest and
  # coverage-core check still gates.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: conformance harness
        run: go test ./conformance/ -v
