name: ci

on:
  push:
    branches: [poc, main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ github.token }}
      - name: build
        run: make build
      # make lint = go vet + buf lint + scripts/check-*.sh hygiene (gofmt,
      # canonicalizer, decoder). buf-setup provides the buf toolchain the
      # proto-lint step needs.
      - name: lint
        run: make lint
      - name: test
        run: go test ./...

  # The conformance harness is a separate required job so a red here is
  # unambiguous — a vector regression or a newly-synced-but-undriven vector
  # is not buried in the general test output. Runs the full conformance package,
  # which is BOTH catalogs: dPLaaX owns the wire (TestDplaaxAllVectors +
  # TestDplaaxVendoredManifest) and the provin profile owns what a claim asserts
  # (TestProvinProfileAllVectors + TestProvinProfileVendoredManifest), each with
  # its own coverage guard and byte-exact pin. Plus TestCheckCoverage. So if
  # branch protection marks only this job required, every manifest and
  # coverage-core check still gates.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: conformance harness
        run: go test ./conformance/ -v

  # Third-party standard vectors (verification/vectors: Wycheproof, RFC 8785,
  # JSON-Schema-Test-Suite) through the product's verifiers, canonicalizer and
  # schema validator. They check production code, so they run on every change,
  # like the jobs above; the verification module is nested, so its tests run
  # from its own directory against this checkout (replace ../). The formal
  # models are a separate workflow (formal.yml).
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: verification/go.mod
          cache: true
          cache-dependency-path: verification/go.sum
      - name: standard vectors
        working-directory: verification
        run: go test ./... -count=1

  # The module reads Unicode general categories from tables it pins to
  # Unicode 15.0.0 (internal/ucd), so a schema's regular expressions are read
  # alike whatever Unicode version the toolchain carries. build-test runs these
  # packages on the toolchain go.mod names (Unicode 15.0.0), where the pinned
  # tables are compared with Go's own code point by code point; this job runs
  # them on a toolchain of a later Unicode version (go1.27: 17.0.0), where the
  # same schemas must be admitted and the same strings matched.
  unicode-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.x'
          cache: true
      - name: pinned Unicode tables on a later toolchain
        env:
          GOTOOLCHAIN: local
        run: |
          go version
          go test ./internal/ucd/... ./schema/... -count=1
