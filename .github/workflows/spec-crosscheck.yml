# Tracks the dPLaaX spec's HEAD: sync its vectors into the harness and run
# the coverage-guarded suite against them.
#
# Direction matters: this is the implementation watching the spec — never the
# other way around. The spec repo carries no knowledge of this repo; a red run
# here means catch-up work HERE (add drivers, update skips, re-vendor), and is
# an early signal only — the vendored vectors in-tree remain the source the
# regular CI pins against until a sync is deliberately committed.
#
# Scope: this crosscheck covers the VECTOR corpus only. The spec's contexts
# are vendored and pinned by in-tree tests (vc/context_test.go); its schemas
# and rule text are not machine-checked here — context/schema/rule drift is
# adopted by deliberate re-vendor, not detected by this workflow.
name: spec-crosscheck

on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: checkout dplaax/spec (public, default branch)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: dplaax/spec
          path: dplaax-spec
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: sync spec HEAD vectors into the harness
        run: scripts/sync-spec-vectors.sh ./dplaax-spec
      - name: run the coverage-guarded harness
        run: go test ./conformance/ -run TestDplaaxAllVectors -v
