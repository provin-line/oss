provin.network.pipeline {
  # The data-plane loops this node runs, as a keyed map (key = loop name). A node
  # runs zero or more loops; an empty map means the node runs no data plane (it
  # serves only the HTTP control plane). Each entry declares one transport loop.
  #
  # slice-17b implements role = "source" only; other roles are a fail-closed boot
  # error until their assembly lands.
  #
  # Example (commented; the default is empty):
  #   loops {
  #     source-a {
  #       role            = "source"
  #       ingress-subject = "ingest.source-a"   # raw external push (valid JSON)
  #       # output-subject = the node's publisher subject == a pipeline DID.
  #       output-subject  = "did:dplaax:reg:org:acme:pipeline:pipe"
  #       issuer {
  #         # issuer = the process DID whose signing key mints the FirstDrop credential.
  #         did                 = "did:dplaax:reg:org:acme:pipeline:pipe:process:source-a"
  #         key-id              = "signing"
  #         verification-method = "did:dplaax:reg:org:acme:pipeline:pipe:process:source-a#signing"
  #       }
  #       pipeline-id          = "pipe"
  #       process-id           = "source-a"
  #       transformation-claim = "convert"   # filter|convert|filter-convert|aggregate|enrich|generate
  #       schema-ref           = ""           # 17b: must be empty
  #     }
  #   }
  loops {}
}
