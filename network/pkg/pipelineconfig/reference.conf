provin.network.pipeline {
  # The data-plane loops this node runs, as a keyed map (key = loop name). A node
  # runs zero or more loops; an empty map means the node runs no data plane (it
  # serves only the HTTP control plane). Each entry declares one transport loop.
  #
  # Roles: "source" (17b), "sink" (17c), "chained" (relay, 17d), and "aggregate" (pool +
  # window, slice-17m). A field that does not belong to a loop's role is a boot error (a
  # sink may not carry an issuer/output-subject; a chained/aggregate block may not appear
  # under a source/sink, etc.). An aggregate has no shared ingress-subject (see agg-a).
  #
  # vc-store-endpoint (optional, node-level): the VCResolverService base URL where
  # producing loops publish issued credentials by content address. Absent => no
  # publication. (Full-chain coverage is the async audit runner's job — slice-17h —
  # which resolves over the local store; it does not need this endpoint.)
  #   vc-store-endpoint = "https://this-node.example/"
  # vc-store-bearer (required when vc-store-endpoint is set, AND when any consuming
  # loop — sink/chained/aggregate — runs): the L1 token the VC-store client presents
  # (the store sits behind the node's auth interceptors). The async batch resolver
  # presents the SAME token when fetching missing predecessors from a peer's
  # VCResolverService, so a consuming-only node needs it even without an endpoint —
  # boot fails closed if it is empty (an empty bearer would otherwise surface only as
  # a silently starved audit at runtime). Source it from the environment rather than
  # committing a secret:
  # vc-store-bearer = ${?VC_STORE_BEARER}
  #   vc-store-bearer = "..."
  #
  # Example (commented; the default is empty):
  #   loops {
  #     source-a {
  #       role            = "source"
  #       ingress-subject = "ingest.source-a"   # raw external push (valid JSON)
  #       # output-subject = the node's publisher subject == a pipeline DID.
  #       output-subject  = "did:dplaax:reg:org:acme:pipeline:pipe"
  #       issuer {
  #         # issuer = the process DID whose signing key mints the FirstDrop credential.
  #         did                 = "did:dplaax:reg:org:acme:pipeline:pipe:process:source-a"
  #         key-id              = "signing"
  #         verification-method = "did:dplaax:reg:org:acme:pipeline:pipe:process:source-a#signing"
  #       }
  #       pipeline-id          = "pipe"
  #       process-id           = "source-a"
  #       transformation-claim = "convert"   # filter|convert|filter-convert|aggregate|enrich|generate
  #       schema-ref           = ""           # optional output-schema reference "<name>@<version>"
  #       # (a registered schema, e.g. "readings@2026-07-10-abcdef0123456789"; name and
  #       # version are url-safe [A-Za-z0-9._-]). Resolved against the schema registry at
  #       # boot (fail-closed: an unregistered or deprecated schema is a boot error) and
  #       # embedded in every issued credential's credentialSubject.schema. A consuming
  #       # verifier resolves it and fails data-integrity on a content-hash mismatch
  #       # (credential.schema-ref). Empty = no reference. Also valid on chained and
  #       # aggregate loops (under their chained { } / aggregate { } blocks).
  #       # push-ingress (source-only, default false): additionally expose this loop's
  #       # ingress as an HTTP push endpoint on the node listener — POST
  #       # /ingest/<loop-name>/push (PDP-guarded: resource "ingest", action "push")
  #       # and GET /ingest/<loop-name>/health (public). The loop name must be a safe
  #       # URL segment ([a-zA-Z0-9._-]).
  #       # push-ingress       = true
  #     }
  #     archive-a {
  #       role            = "sink"
  #       # ingress-subject = the GRANTED upstream subject (the upstream source's
  #       # output-subject / pipeline DID, imported into this node's account).
  #       ingress-subject = "did:dplaax:reg:org:acme:pipeline:pipe"
  #       sink {
  #         kind                  = "observation-only"  # observation-only | production | archival
  #         # production/archival additionally require a non-empty allow-issuers
  #         # list (below); archival also MUST emit receipts (receipt block below).
  #         # allow-issuers = the local issuer allow-list — a consumed credential
  #         # is admitted only if its issuer DID matches one of these patterns
  #         # (segment-aware globs; default-distrust). Required non-empty for
  #         # production/archival, optional (unrestricted) for observation-only.
  #         # allow-issuers = ["did:dplaax:reg:org:acme:*"]
  #         # receipt = sink-receipt issuance (MAY for production, MUST for
  #         # archival). The issuer is the process identity receipts are signed
  #         # under; receipts publish to the local VC store + a dedicated tlog +
  #         # the audit queue (never in-band on the chain).
  #         # receipt { issuer {
  #         #   did = "did:dplaax:reg:org:acme:pipeline:pipe:process:archive"
  #         #   key-id = "signing"
  #         #   verification-method = "did:dplaax:reg:org:acme:pipeline:pipe:process:archive#signing"
  #         # } }
  #         # output = where this loop delivers consumed events. Absent = console
  #         # (stdout NDJSON). "file" appends the same NDJSON lines to path —
  #         # a durable stream a consumer can tail without scraping stdout.
  #         # Loops sharing one file must spell the path identically (writer
  #         # sharing is by cleaned path, not by inode).
  #         # output { type = "file", path = "/var/provin/consumed.ndjson" }
  #         verification-strategy = "adjacent"          # the only ingress strategy (full-chain audit is async, slice-17h)
  #         upstream-endpoint     = "https://acme.example/pipelines/pipe"  # audit boundary
  #       }
  #     }
  #     relay-a {
  #       role            = "chained"
  #       ingress-subject = "did:dplaax:reg:org:acme:pipeline:pipe"   # granted upstream subject
  #       chained {
  #         # produces (like a source): re-signs a ChainPreserving credential downstream.
  #         output-subject        = "did:dplaax:reg:org:beta:pipeline:relay"
  #         issuer {
  #           did                 = "did:dplaax:reg:org:beta:pipeline:relay:process:r1"
  #           key-id              = "signing"
  #           verification-method = "did:dplaax:reg:org:beta:pipeline:relay:process:r1#signing"
  #         }
  #         pipeline-id           = "relay"
  #         process-id            = "r1"
  #         transformation-claim  = "convert"
  #         # consumes (like a sink): verifies its ingress credential.
  #         verification-strategy = "adjacent"          # the only ingress strategy (full-chain audit is async, slice-17h)
  #         upstream-endpoint     = "https://acme.example/pipelines/pipe"
  #         # transform (optional): whole-document JSONata; omit = passthrough re-attestation.
  #         converter             = "{ 'reading': reading, 'relayed': true }"
  #         filters               = ["reading > 0"]    # optional JSONata predicates (all must pass)
  #       }
  #     }
  #     agg-a {
  #       role = "aggregate"
  #       # An aggregate has NO shared ingress-subject: it consumes N upstream subjects,
  #       # listed under aggregate.ingresses (a keyed map). On each window it folds the
  #       # pooled, verified inputs into ONE provin:aggregate FirstDrop (the claim + the
  #       # JCS source-root canonical are fixed by the role, not config keys).
  #       aggregate {
  #         # produces (like a source): the aggregate FirstDrop's identity + output.
  #         output-subject        = "did:dplaax:reg:org:acme:pipeline:agg"
  #         issuer {
  #           did                 = "did:dplaax:reg:org:acme:pipeline:agg:process:a1"
  #           key-id              = "signing"
  #           verification-method = "did:dplaax:reg:org:acme:pipeline:agg:process:a1#signing"
  #         }
  #         pipeline-id           = "agg"
  #         process-id            = "a1"
  #         schema-ref            = ""           # optional fold-output schema "<name>@<version>" (same contract as source/chained)
  #         # consumes (like a sink, per input): verifies each ingress credential.
  #         verification-strategy = "adjacent"          # the only ingress strategy
  #         window                = 5s                  # fold trigger interval (> 0)
  #         # ingresses: the upstream subjects to pool (>= 1), each a granted pipeline DID
  #         # with the endpoint where its credentials can be fetched (the audit boundary).
  #         # output-subject must differ from every ingress subject (no self-consumption).
  #         ingresses {
  #           src-a { subject = "did:dplaax:reg:org:acme:pipeline:pipe-a", upstream-endpoint = "https://acme.example/pipelines/pipe-a" }
  #           src-b { subject = "did:dplaax:reg:org:acme:pipeline:pipe-b", upstream-endpoint = "https://acme.example/pipelines/pipe-b" }
  #         }
  #       }
  #     }
  #   }
  loops {}

  # max-credential-size (node-level): the maximum bytes of a single VC accepted on the
  # fetch/store path — the VCResolverService client (the async batch resolver's fetch)
  # and the server handler (inbound StoreVC).
  # A hostile peer must not OOM the node with a bloated body. A non-positive override fails
  # startup. Default 1 MiB.
  max-credential-size = 1048576

  # max-push-body-size (node-level): the maximum bytes of one HTTP push request body
  # (the apipush adapter mounted for loops with push-ingress = true). Distinct from
  # max-credential-size: that bounds credentials on the fetch/store path, this bounds a
  # raw ingest payload. A non-positive override fails startup. Default 1 MiB.
  max-push-body-size = 1048576

  # max-retain-chunk-size (node-level): the maximum bytes of one RetainPayload chunk
  # frame (PayloadStoreService, the by-reference payload write path) — mounted as the
  # per-RPC connect read cap, so an oversized frame never reaches the handler's own
  # byte-accounting. A hostile caller must not OOM the node with a bloated frame. A
  # non-positive override fails startup. Default 1 MiB.
  max-retain-chunk-size = 1048576

  # max-retain-payload-size (node-level): the maximum declared_size a RetainPayload
  # caller may commit to for one retained payload (PayloadStoreService) — the cumulative
  # quota, distinct from max-retain-chunk-size (which bounds a single frame). A
  # non-positive override fails startup. Default 64 MiB.
  max-retain-payload-size = 67108864

  # tlog-mirror (node-level): tlog-custody tuning. The two caps are D-T2 rule 5,
  # enforced by MirrorLogSegment — a batch over either cap is ResourceExhausted,
  # checked before any store interaction; read by the registry-side handler
  # (cmd/network), and the client-side shipper bounds its batches to the same
  # values. flush-interval is client-side only (the shipper's cadence — no
  # handler reads it). cmd/standalone loads the same keys but only a wired
  # mirror store consults the caps.
  tlog-mirror {
    # max-batch-records: the maximum number of records framed into
    # record_payloads_framed accepted in one MirrorLogSegment call. A
    # non-positive override fails startup. Default 256.
    max-batch-records = 256
    # max-batch-bytes: the maximum summed byte length of the records framed into
    # record_payloads_framed accepted in one MirrorLogSegment call. A
    # non-positive override fails startup.
    # Default 4 MiB. This value ALSO derives MirrorLogSegment's own transport
    # read cap (internal/netcompose's mirrorReadCapBytes) — the mount can
    # never be smaller than what this key allows, by construction, so no
    # operator coordination with max-credential-size (above, an unrelated
    # class — the single-VC StoreVC/fetch path) is needed for THAT cap.
    # Separately, boot ALSO requires max-batch-bytes >= max-credential-size:
    # a single mirrored record (e.g. a sink-receipt log entry, which carries
    # a full credential) can be as large as max-credential-size, and a batch
    # cap below that could never ship such a record even alone —
    # LoadPipelineConfig fails closed on this, naming both keys.
    max-batch-bytes = 4194304
    # flush-interval: the ticking cadence the client-side shipper
    # (pipeline/transport/tlogship) uses to flush buffered records via
    # MirrorLogSegment, independent of the two caps above (a flush also
    # fires early once a cap is hit). A non-positive override fails
    # startup. Default 5s — kept consistent with
    # pipeline/transport/tlogship.DefaultFlushInterval (this package
    # cannot import pipeline/ — network/ and pipeline/ never import each
    # other, AGENTS.md rule 2 — so the value is duplicated here by
    # convention, not by reference).
    flush-interval = 5s
  }

  # batch-resolver (node-level): the async chain-audit resolver (slice-17g) that drains the
  # unresolved-predecessor pool, fetching missing predecessors from peers and re-submitting
  # them until each consumed chain is complete in the local store. It runs only on a node
  # with a consuming loop (sink/chained — the population that accumulates holes). Every value
  # is required and must be positive; a non-positive override fails startup (no Go defaults).
  batch-resolver {
    # interval: delay between drain ticks.
    interval = 30s
    # batch-size: max holes drained per tick.
    batch-size = 64
    # max-retries: transient-failure retry budget before a hole is dropped.
    max-retries = 5
    # max-depth: a hole at or beyond this distance from a consumed head is dropped without
    # fetching — the DoS backstop against an adversarial unbounded fabricated chain.
    max-depth = 1024
  }

  # audit-runner (node-level): the async audit runner (slice-17h) that drains the registry
  # of consumed chain heads, assembles each chain from the local store (filled by the batch
  # resolver), runs full-chain verification (L1 proofs + chain structure + origin), and
  # records a per-head verdict. It runs only on a node with a consuming loop (the population
  # that registers heads). Every value is required and must be positive; a non-positive
  # override fails startup (no Go defaults).
  audit-runner {
    # interval: delay between audit ticks.
    interval = 30s
    # batch-size: max heads audited per tick.
    batch-size = 64
    # max-attempts: backstop bound for a persistently-indeterminate NON-hole verdict (a
    # hole's liveness is governed by the unresolved pool, not this count).
    max-attempts = 10
  }
}
