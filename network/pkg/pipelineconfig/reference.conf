provin.network.pipeline {
  # The data-plane loops this node runs, as a keyed map (key = loop name). A node
  # runs zero or more loops; an empty map means the node runs no data plane (it
  # serves only the HTTP control plane). Each entry declares one transport loop.
  #
  # Roles: "source" (17b), "sink" (17c), "chained" (relay, 17d), and "aggregate" (pool +
  # window, slice-17m). A field that does not belong to a loop's role is a boot error (a
  # sink may not carry an issuer/output-subject; a chained/aggregate block may not appear
  # under a source/sink, etc.). An aggregate has no shared ingress-subject (see agg-a).
  #
  # vc-store-endpoint (optional, node-level): the VCResolverService base URL where
  # producing loops publish issued credentials by content address. Absent => no
  # publication. (Full-chain coverage is the async audit runner's job — slice-17h —
  # which resolves over the local store; it does not need this endpoint.)
  #   vc-store-endpoint = "https://this-node.example/"
  # vc-store-bearer (required when vc-store-endpoint is set): the L1 token the VC-store
  # client presents (the store sits behind the node's auth interceptors). Source it from
  # the environment rather than committing a secret: vc-store-bearer = ${?VC_STORE_BEARER}
  #   vc-store-bearer = "..."
  #
  # Example (commented; the default is empty):
  #   loops {
  #     source-a {
  #       role            = "source"
  #       ingress-subject = "ingest.source-a"   # raw external push (valid JSON)
  #       # output-subject = the node's publisher subject == a pipeline DID.
  #       output-subject  = "did:dplaax:reg:org:acme:pipeline:pipe"
  #       issuer {
  #         # issuer = the process DID whose signing key mints the FirstDrop credential.
  #         did                 = "did:dplaax:reg:org:acme:pipeline:pipe:process:source-a"
  #         key-id              = "signing"
  #         verification-method = "did:dplaax:reg:org:acme:pipeline:pipe:process:source-a#signing"
  #       }
  #       pipeline-id          = "pipe"
  #       process-id           = "source-a"
  #       transformation-claim = "convert"   # filter|convert|filter-convert|aggregate|enrich|generate
  #       schema-ref           = ""           # must be empty (no schema validation yet)
  #     }
  #     archive-a {
  #       role            = "sink"
  #       # ingress-subject = the GRANTED upstream subject (the upstream source's
  #       # output-subject / pipeline DID, imported into this node's account).
  #       ingress-subject = "did:dplaax:reg:org:acme:pipeline:pipe"
  #       sink {
  #         kind                  = "observation-only"  # observation-only only (production/archival still gated)
  #         verification-strategy = "adjacent"          # the only ingress strategy (full-chain audit is async, slice-17h)
  #         upstream-endpoint     = "https://acme.example/pipelines/pipe"  # audit boundary
  #       }
  #     }
  #     relay-a {
  #       role            = "chained"
  #       ingress-subject = "did:dplaax:reg:org:acme:pipeline:pipe"   # granted upstream subject
  #       chained {
  #         # produces (like a source): re-signs a ChainPreserving credential downstream.
  #         output-subject        = "did:dplaax:reg:org:beta:pipeline:relay"
  #         issuer {
  #           did                 = "did:dplaax:reg:org:beta:pipeline:relay:process:r1"
  #           key-id              = "signing"
  #           verification-method = "did:dplaax:reg:org:beta:pipeline:relay:process:r1#signing"
  #         }
  #         pipeline-id           = "relay"
  #         process-id            = "r1"
  #         transformation-claim  = "convert"
  #         # consumes (like a sink): verifies its ingress credential.
  #         verification-strategy = "adjacent"          # the only ingress strategy (full-chain audit is async, slice-17h)
  #         upstream-endpoint     = "https://acme.example/pipelines/pipe"
  #         # transform (optional): whole-document JSONata; omit = passthrough re-attestation.
  #         converter             = "{ 'reading': reading, 'relayed': true }"
  #         filters               = ["reading > 0"]    # optional JSONata predicates (all must pass)
  #       }
  #     }
  #     agg-a {
  #       role = "aggregate"
  #       # An aggregate has NO shared ingress-subject: it consumes N upstream subjects,
  #       # listed under aggregate.ingresses (a keyed map). On each window it folds the
  #       # pooled, verified inputs into ONE provin:aggregate FirstDrop (the claim + the
  #       # JCS source-root canonical are fixed by the role, not config keys).
  #       aggregate {
  #         # produces (like a source): the aggregate FirstDrop's identity + output.
  #         output-subject        = "did:dplaax:reg:org:acme:pipeline:agg"
  #         issuer {
  #           did                 = "did:dplaax:reg:org:acme:pipeline:agg:process:a1"
  #           key-id              = "signing"
  #           verification-method = "did:dplaax:reg:org:acme:pipeline:agg:process:a1#signing"
  #         }
  #         pipeline-id           = "agg"
  #         process-id            = "a1"
  #         # consumes (like a sink, per input): verifies each ingress credential.
  #         verification-strategy = "adjacent"          # the only ingress strategy
  #         window                = 5s                  # fold trigger interval (> 0)
  #         # ingresses: the upstream subjects to pool (>= 1), each a granted pipeline DID
  #         # with the endpoint where its credentials can be fetched (the audit boundary).
  #         # output-subject must differ from every ingress subject (no self-consumption).
  #         ingresses {
  #           src-a { subject = "did:dplaax:reg:org:acme:pipeline:pipe-a", upstream-endpoint = "https://acme.example/pipelines/pipe-a" }
  #           src-b { subject = "did:dplaax:reg:org:acme:pipeline:pipe-b", upstream-endpoint = "https://acme.example/pipelines/pipe-b" }
  #         }
  #       }
  #     }
  #   }
  loops {}

  # max-credential-size (node-level): the maximum bytes of a single VC accepted on the
  # fetch/store path — the VCResolverService client (the async batch resolver's fetch)
  # and the server handler (inbound StoreVC).
  # A hostile peer must not OOM the node with a bloated body. A non-positive override fails
  # startup. Default 1 MiB.
  max-credential-size = 1048576

  # batch-resolver (node-level): the async chain-audit resolver (slice-17g) that drains the
  # unresolved-predecessor pool, fetching missing predecessors from peers and re-submitting
  # them until each consumed chain is complete in the local store. It runs only on a node
  # with a consuming loop (sink/chained — the population that accumulates holes). Every value
  # is required and must be positive; a non-positive override fails startup (no Go defaults).
  batch-resolver {
    # interval: delay between drain ticks.
    interval = 30s
    # batch-size: max holes drained per tick.
    batch-size = 64
    # max-retries: transient-failure retry budget before a hole is dropped.
    max-retries = 5
    # max-depth: a hole at or beyond this distance from a consumed head is dropped without
    # fetching — the DoS backstop against an adversarial unbounded fabricated chain.
    max-depth = 1024
  }

  # audit-runner (node-level): the async audit runner (slice-17h) that drains the registry
  # of consumed chain heads, assembles each chain from the local store (filled by the batch
  # resolver), runs full-chain verification (L1 proofs + chain structure + origin), and
  # records a per-head verdict. It runs only on a node with a consuming loop (the population
  # that registers heads). Every value is required and must be positive; a non-positive
  # override fails startup (no Go defaults).
  audit-runner {
    # interval: delay between audit ticks.
    interval = 30s
    # batch-size: max heads audited per tick.
    batch-size = 64
    # max-attempts: backstop bound for a persistently-indeterminate NON-hole verdict (a
    # hole's liveness is governed by the unresolved pool, not this count).
    max-attempts = 10
  }
}
