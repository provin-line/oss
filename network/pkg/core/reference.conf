provin.network.core {
  # Address the standalone binary listens on (host:port; host may be empty).
  listen-addr = ":8443"
  # Root directory for durable YAML state (schemas, DID docs, …).
  data-dir = "./data"
  # Private-deployment opt-in: permit RFC 1918 IPv4 outbound targets in the
  # SSRF guard (LAN, VPC, container networks). Link-local/metadata, CGNAT, and
  # IPv6 unique-local stay blocked regardless.
  allow-private-networks = false

  metrics {
    # Mount the unauthenticated /metrics endpoint (OpenTelemetry counters,
    # Prometheus exposition) on the serving listener. Off by default: the
    # listener is not loopback-bound, and metrics expose loop names and
    # traffic/failure/verdict rates — more than /healthz. Enable where the
    # listener's network is trusted (the quickstart compose does).
    enabled = false
  }

  dev {
    # Local-dev ONLY: permit loopback outbound targets in the SSRF guard.
    allow-loopback = false
  }
}
