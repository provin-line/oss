provin.network.core {
  # Address the standalone binary listens on (host:port; host may be empty).
  # Default is loopback-only (secure by default): the node serves cleartext
  # h2c, so exposing it on a non-loopback interface requires a deliberate
  # transport-security posture — see the tls block. Set to ":8443" (or a
  # specific interface) to expose, together with tls.cert-file/key-file or
  # tls.allow-cleartext.
  listen-addr = "127.0.0.1:8443"
  # Root directory for durable YAML state (schemas, DID docs, …).
  data-dir = "./data"
  # Private-deployment opt-in: permit RFC 1918 IPv4 outbound targets in the
  # SSRF guard (LAN, VPC, container networks). Link-local/metadata, CGNAT, and
  # IPv6 unique-local stay blocked regardless.
  #
  # Enabling this ALSO closes cross-registry DID resolution to the configured
  # registry set: an unmapped (attacker-supplied) registry no longer falls back
  # to the registry's own https origin, so it cannot turn the pre-signature probe
  # into an internal-network scan. Therefore, with this = true you MUST scope
  # resolution via provin.network.chain.nats.registry-base-urls (a per-registry
  # map) or resolver-base-url (a single base); the node fails boot otherwise.
  allow-private-networks = false

  tls {
    # Node-native TLS: serve h2 over TLS (ALPN). Both or neither — one alone is
    # a boot error. The pair is validated in a boot PREFLIGHT, before any store
    # is created or transport dialed, and the loaded pair is what serves: the
    # files are never re-read afterwards. Rotation therefore needs a restart
    # (no hot reload). When set, TLS wins and allow-cleartext is ignored.
    #
    # Protocol floor: TLS 1.2 minimum, pinned explicitly rather than inherited
    # from the library default — the floor is this deployment's contract, and a
    # contract held by a default is one upgrade away from changing silently.
    # Cipher suites follow the Go standard library's secure defaults on purpose:
    # TLS 1.3 suites are not selectable through the API, and a frozen allowlist
    # would block future stdlib security improvements (see SECURITY.md).
    cert-file = ""
    key-file  = ""
    # Acknowledge serving cleartext h2c on a NON-loopback listener. Required
    # (fail-closed) when the listener is non-loopback and no cert/key are set.
    # This is an ACKNOWLEDGEMENT, not a claim of a terminator: production must
    # place a real TLS terminator in front AND make this cleartext backend
    # reachable only from it (loopback / netns / firewall). Ignored for a
    # loopback-only listener.
    allow-cleartext = false
  }

  metrics {
    # Mount the unauthenticated /metrics endpoint (OpenTelemetry counters,
    # Prometheus exposition) on the serving listener. Off by default: the
    # listener is not loopback-bound, and metrics expose loop names and
    # traffic/failure/verdict rates — more than /healthz. Enable where the
    # listener's network is trusted (the quickstart compose does).
    enabled = false
  }

  dev {
    # Local-dev ONLY: permit loopback outbound targets in the SSRF guard.
    allow-loopback = false
  }
}
