provin.network.registry {
  # The {registry} segment every issued did:dplaax carries (e.g. "poc.dplaax.dev").
  # No default — the registry has no canonical identity until an operator sets it,
  # so the binary fails to boot until configured. A wrong/empty id would mint and
  # resolve DIDs under the wrong authority.
  id = ""

  # Service endpoints embedded in every issued Pipeline/Process DID Document,
  # keyed by endpoint id (the key becomes the "#<id>" fragment in the document).
  # Empty by default. Example:
  #   service-endpoints {
  #     vc-resolver { type = "VCResolver", url = "https://registry.example/vc" }
  #   }
  service-endpoints {}
}
