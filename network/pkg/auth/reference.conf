provin.network.auth {
  # The authorization decision point (PDP) backend: o3co | opa | cedar | static.
  # Every backend is fail-closed — the selected backend's required config must be
  # set or the server does not boot. Default is o3co (unchanged behavior for
  # deployments that only set policy-verifier-url).
  backend = "o3co"

  # Base URL of the o3co auth.policy-verifier (backend = o3co). Must carry an
  # explicit http:// or https:// scheme. No default — the server fails to boot
  # until an operator sets it, so authorization is never silently evaluated
  # against nothing.
  policy-verifier-url = ""

  # backend = "opa": Open Policy Agent REST endpoint. base-url must carry an
  # explicit http(s):// scheme; policy-path is the OPA data path to query.
  opa.base-url = ""
  opa.policy-path = ""

  # backend = "cedar": Cedar-agent REST endpoint (base-url, http(s)://).
  cedar.base-url = ""

  # backend = "cedar": how the caller's bearer JWT is verified. A Cedar agent
  # authenticates nothing, so the node verifies the token itself (signature, exp,
  # nbf with 30s leeway, iss, aud) and asks the agent about the token's sub.
  # issuer and audience are required, and exactly one of jwks-url and secret must
  # be set; the node does not boot otherwise.
  #   issuer / audience  required iss value / a value aud must contain
  #   jwks-url           https URL of the issuer's key set (asymmetric algorithms;
  #                      no redirects, 5s timeout, 1 MiB cap, 10 min cache)
  #   secret             shared HS256 key, at least 32 bytes after decoding
  #   secret-encoding    utf8 (default) | hex | base64 — how secret is written
  cedar.jwt.issuer = ""
  cedar.jwt.audience = ""
  cedar.jwt.jwks-url = ""
  cedar.jwt.secret = ""
  # cedar.jwt.secret-encoding is unset by default, which reads secret as utf8;
  # it may be set only together with secret.

  # PDP endpoints (host:port) that may be called over plaintext http. Plaintext
  # is otherwise refused for any non-loopback host. A listed endpoint is reached
  # only when it resolves to a private address (10/8, 100.64/10, 172.16/12,
  # 192.168/16, fc00::/7; never a cloud metadata address), so list only backends
  # on a network trusted against reading and changing what crosses it. A host
  # name entry is accepted at startup and address-checked on every connection
  # (a name that resolves to a non-private address is not connected to); a
  # malformed entry (not host:port, bad port) or an IP literal that is not private
  # fails startup. Applies to the
  # selected o3co | opa | cedar backend. Example: ["policy-verifier:3001"]
  plain-internal = []

  # backend = "static": in-process authorization allow-list. Each entry is
  # "resource:action" (exact, "*", or "prefix/*" match). An empty list denies
  # everything (the safe default). WARNING: static is NOT authentication — the
  # bearer token is only checked for presence, never verified. Use it only for a
  # single-tenant or perimeter-authenticated deployment, never one relying on the
  # PDP to authenticate callers. Example: allow = ["dids:read", "schemas/*:*"]
  static.allow = []
}
