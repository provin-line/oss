provin.network.chain {
  # Pub-sub transport backing chain connections: "nats" (production) or "noop"
  # (debug/test only — requires BOTH a `dev` build and dev.allow-noop-transport).
  transport = "nats"
  nats {
    # nats endpoint advertised to subscribers in connection_info.
    url = ""
    # Boot budget for the node's initial broker dial: the connect retries with
    # backoff until it succeeds or this elapses, then boot fails closed. 0s =
    # strict fail-fast (one attempt). Covers orchestrated starts where the
    # broker and the node come up concurrently.
    connect-wait = 30s
    # Files holding the raw nkey seeds (one seed per file, trailing newline ok).
    # Key material is never inlined in config text.
    account-seed-file = ""
    trust-root-seed-file = ""
    # Directory the account-claims JWTs are published to; the nats-server
    # directory account resolver reads it.
    resolver-dir = ""
    # This node's DID. The subscriber side signs peer RPCs as this identity, so
    # its #auth key must be in the keystore and its DID document resolvable.
    node-did = ""
    # Optional single-registry / dev override for the resolution base URL. A
    # NON-EMPTY value maps EVERY registry to this one URL (it ignores the registry
    # id), so it is for single-tenant / local-dev (and the boot e2e) only. Leave
    # empty for the didresolver default (https://{registry}). Mutually exclusive
    # with registry-base-urls.
    resolver-base-url = ""
    # Optional per-registry resolution overrides: quoted registry id -> absolute
    # http(s) base URL. A registry NOT in the map resolves via the default
    # (https://{registry}), so partial maps compose with public registries.
    # Mutually exclusive with resolver-base-url.
    #   registry-base-urls {
    #     "mfg.poc.dplaax.dev" = "http://mfg:8443"
    #   }
    registry-base-urls {}
    # Files holding the system-account user credentials for the live claims
    # push: on every grant the node pushes its updated account JWT to the
    # RUNNING broker ($SYS.REQ.ACCOUNT.<account>.CLAIMS.UPDATE), so grants
    # take effect without a broker restart. Set BOTH to enable, leave BOTH
    # empty to disable (claims then reach the broker via the resolver
    # directory only -- grants to already-connected accounts need the manual
    # runbook). Provisioning narrows this user to exactly this node's
    # claims-update subject.
    sys-user-jwt-file = ""
    sys-user-seed-file = ""
  }
  dev {
    # Dev builds ONLY: permit the noop transport. No effect in a production build
    # (the production build excludes infra/noop entirely).
    allow-noop-transport = false
  }
  # ReportEmitHealth (Task 10 D4): per-publisher stripped-publish health
  # reports, gating by-reference advertisement on a report-mode network node
  # (cmd/network, chainmanager.WithPublisherHealth). cmd/standalone loads this
  # block too but does not consume it — it continues to gate advertisement on
  # its own in-process by-reference health (chainmanager.WithByReferenceHealth).
  emit-health {
    # How long a ReportEmitHealth report stays fresh before it is treated as
    # Expired — also the value returned as ReportEmitHealthResponse.ttl, so a
    # reporting publisher knows when to re-report before its report goes
    # stale from a consumer's point of view. Must be positive.
    ttl = 90s
    # Whether by-reference is advertised for a publisher that has NEVER
    # called ReportEmitHealth. false (default) is fail-degraded: a
    # report-mode node requires at least one healthy report before
    # advertising by-reference for that publisher.
    advertise-without-reports = false
  }
}
